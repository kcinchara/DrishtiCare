    <circle cx="120" cy="92" r="3.2" />
    <circle cx="102" cy="98" r="3.0" />
    <circle cx="108" cy="114" r="3.0" />
    <circle cx="128" cy="102" r="2.6" />
    <circle cx="84" cy="118" r="2.8" />
    <!-- Peripheral subtle nodes -->
    <circle cx="67" cy="100" r="1.6" />
    <circle cx="74" cy="123" r="1.6" />
    <circle cx="111" cy="132" r="1.6" />
    <circle cx="105" cy="67" r="1.6" />
