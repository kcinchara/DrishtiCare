<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="dc-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="dc-iris-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Top Blue Eyelid / Swirl Horn -->
  <path d="M 20 100 C 35 62, 70 48, 100 48 C 135 48, 165 65, 180 100 C 158 78, 138 68, 100 68 C 76 68, 56 78, 46 92 C 54 75, 75 64, 100 64 C 122 64, 134 72, 139 77 C 132 64, 118 56, 100 56 C 68 56, 40 76, 20 100 Z" fill="url(#dc-blue-grad)"/>

  <!-- Bottom Blue Eyelid / Swirl Horn -->
  <path d="M 180 100 C 165 138, 130 152, 100 152 C 65 152, 35 135, 20 100 C 42 122, 62 132, 100 132 C 124 132, 144 122, 154 108 C 146 125, 125 136, 100 136 C 78 136, 66 128, 61 123 C 68 136, 82 144, 100 144 C 132 144, 160 124, 180 100 Z" fill="url(#dc-blue-grad)"/>

  <!-- Central Retinal Iris / Fundus Disc -->
