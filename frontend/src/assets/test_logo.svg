    <line x1="72" y1="100" x2="86" y2="85" />
    <line x1="86" y1="85" x2="104" y2="78" />
    <line x1="104" y1="78" x2="120" y2="92" />
    <line x1="72" y1="100" x2="102" y2="98" />
    <line x1="102" y1="98" x2="120" y2="92" />
    <line x1="120" y1="92" x2="128" y2="102" />
    <line x1="72" y1="100" x2="84" y2="118" />
    <line x1="84" y1="118" x2="108" y2="114" />
    <line x1="102" y1="98" x2="108" y2="114" />
    <line x1="108" y1="114" x2="128" y2="102" />
    <!-- Peripheral branching -->
    <line x1="72" y1="100" x2="67" y2="100" />
    <line x1="84" y1="118" x2="74" y2="123" />
    <line x1="108" y1="114" x2="111" y2="132" />
