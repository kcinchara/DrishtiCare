version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drishticare_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/media:/app/media
      - ./backend/retinal_triage.db:/app/retinal_triage.db
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DEMO_MODE=${DEMO_MODE:-False}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./retinal_triage.db}
      - SECRET_KEY=${SECRET_KEY:-sih-retinal-edge-triage-jwt-secret-key-2026}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:80}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: drishticare_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
